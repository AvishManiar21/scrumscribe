[project]
name = "scrumscribe"
version = "0.1.0"
description = "Local-first scrum meeting agent: turns meeting transcripts into structured standup notes with cross-meeting memory. No API keys, no cloud."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scrumscribe = "scrumscribe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
